syntax = "proto3";

package protectorate.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/hotschmoe/protectorate/gen/protectorate/v1;protectoratev1";

// EventService streams hub events. It is server-streaming only, so the MCP
// bridge does not expose it as a tool.
service EventService {
  // Subscribe streams every event the hub publishes until the client disconnects.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message SubscribeRequest {}

// Event is the generic envelope for everything the hub announces.
message Event {
  string id = 1;
  google.protobuf.Timestamp time = 2;
  // kind is a dotted name such as "quota.updated", "session.created" or "note.created".
  string kind = 3;
  // subject is the entity the event is about, e.g. a provider or item id.
  string subject = 4;
  // payload carries kind-specific fields.
  google.protobuf.Struct payload = 5;
}

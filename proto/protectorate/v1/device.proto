syntax = "proto3";

package protectorate.v1;

import "google/protobuf/timestamp.proto";

// DeviceService manages the clients that may use the hub. Adding a device
// returns its bearer token once; the hub keeps only a hash of it.
service DeviceService {
  rpc AddDevice(AddDeviceRequest) returns (AddDeviceResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  rpc RenameDevice(RenameDeviceRequest) returns (RenameDeviceResponse);
}

// DeviceInfo describes a device. Its id is derived from its token and names
// it in audit lines.
message DeviceInfo {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp added_at = 3;
  string added_by = 4;
  // last_used_at is persisted at most about once a minute.
  google.protobuf.Timestamp last_used_at = 5;
}
message AddDeviceRequest {
  string name = 1;
}
message AddDeviceResponse {
  DeviceInfo device = 1;
  // token is shown only here.
  string token = 2;
}
message ListDevicesRequest {}
message ListDevicesResponse {
  repeated DeviceInfo devices = 1;
}
message RevokeDeviceRequest {
  string id = 1;
}
message RevokeDeviceResponse {
  DeviceInfo device = 1;
}
message RenameDeviceRequest {
  string id = 1;
  string name = 2;
}
message RenameDeviceResponse {
  DeviceInfo device = 1;
}

syntax = "proto3";

package protectorate.v1;

import "google/protobuf/timestamp.proto";

// HubService reports on the hub process itself.
service HubService {
  // GetStatus returns the hub version, host platform and uptime.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetSleeveRuntime reports the detected sandbox runtime and shared cache lower.
  rpc GetSleeveRuntime(GetSleeveRuntimeRequest) returns (GetSleeveRuntimeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetStatusRequest {}

message GetStatusResponse {
  // version is the hub build version.
  string version = 1;
  string hostname = 2;
  // os and arch are Go GOOS/GOARCH values of the hub host.
  string os = 3;
  string arch = 4;
  int64 uptime_seconds = 5;
  google.protobuf.Timestamp started_at = 6;
  string available_version = 7;
  string update_channel = 8;
  string release_notes_url = 9;
  // True when the running release is the guardian-confirmed active release.
  bool release_confirmed = 10;
}

message GetSleeveRuntimeRequest {}

message GetSleeveRuntimeResponse {
  // Legacy fields retained while the Flutter client moves to runtime/helper_path.
  string bwrap_path = 1;
  string bwrap_version = 2;
  bool overlays = 3;
  string go_build_cache = 4;
  string go_build_lower = 5;
  uint64 snapshot_bytes = 6;
  uint64 snapshot_entries = 7;
  google.protobuf.Timestamp snapshot_prepared_at = 8;
  bool snapshot_preparing = 9;
  string snapshot_error = 10;
  uint64 snapshot_limit_bytes = 11;
  // runtime identifies the active sleeve launcher, for example
  // "rust-namespaces". Empty means no launcher is configured.
  string runtime = 12;
  // helper_path is the Linux namespace helper executable used by the runtime.
  string helper_path = 13;
}

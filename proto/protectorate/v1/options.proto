syntax = "proto3";

package protectorate.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/hotschmoe/protectorate/gen/protectorate/v1;protectoratev1";

extend google.protobuf.MethodOptions {
  // destructive marks an RPC that irreversibly destroys state. Clients such
  // as the MCP bridge surface it as a hint.
  bool destructive = 50001;
}

extend google.protobuf.ServiceOptions {
  // node_local marks a service served by node agents, not by the hub. Hub
  // clients such as the MCP bridge leave it out.
  bool node_local = 50002;

  // owner_only marks a service only the owner token may call, whatever
  // scopes another token carries. The MCP bridge leaves it out.
  bool owner_only = 50003;
}

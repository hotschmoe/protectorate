syntax = "proto3";

package protectorate.v1;

option go_package = "spike/connect/gen/protectorate/v1;protectoratev1";

message Sleeve {
  string id = 1;
  string name = 2;
  string harness = 3;
  string state = 4;
}

message ListRequest {}

message ListResponse {
  repeated Sleeve sleeves = 1;
}

message SpawnRequest {
  // Human-readable sleeve name, unique per hub.
  string name = 1;
  // Agent harness to run: claude, gemini, opencode.
  string harness = 2;
}

message SpawnResponse {
  Sleeve sleeve = 1;
}

// Manages sleeves.
service SleeveService {
  // List returns all sleeves.
  rpc List(ListRequest) returns (ListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Spawn creates a sleeve running the given harness.
  rpc Spawn(SpawnRequest) returns (SpawnResponse);
}

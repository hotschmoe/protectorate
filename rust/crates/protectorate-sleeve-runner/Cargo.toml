[package]
name = "protectorate-sleeve-runner"
version = "0.1.0"
edition.workspace = true
autotests = false

[dependencies]
protectorate-sandbox = { path = "../protectorate-sandbox" }
protectorate-audit = { path = "../protectorate-audit" }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }

[[bin]]
name = "protectorate-sleeve-runner"
path = "src/main.rs"
test = false

[[bin]]
name = "protectorate-sleeve-sandbox-helper"
path = "src/helper.rs"
test = false

[dev-dependencies]
tempfile = { workspace = true }

[lib]
test = false
doctest = false

[[test]]
name = "e2e"
path = "tests/e2e.rs"

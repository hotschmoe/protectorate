[package]
name = "protectorate-sleeve-runner"
version = "0.1.0"
edition.workspace = true
autotests = false

[dependencies]
protectorate-sandbox = { path = "../protectorate-sandbox" }
protectorate-audit = { path = "../protectorate-audit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "protectorate-sleeve-runner"
path = "src/main.rs"
test = false

[[bin]]
name = "protectorate-sleeve-sandbox-helper"
path = "src/helper.rs"
test = false

[dev-dependencies]
tempfile = "3"

[lib]
test = false
doctest = false

[[test]]
name = "e2e"
path = "tests/e2e.rs"

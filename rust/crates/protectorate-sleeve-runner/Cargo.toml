[package]
name = "protectorate-sleeve-runner"
version = "0.1.0"
edition.workspace = true

[dependencies]
protectorate-sandbox = { path = "../protectorate-sandbox" }
protectorate-audit = { path = "../protectorate-audit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[[bin]]
name = "protectorate-sleeve-runner"
path = "src/main.rs"

[[bin]]
name = "protectorate-sleeve-sandbox-helper"
path = "src/helper.rs"

[dev-dependencies]
tempfile = "3"

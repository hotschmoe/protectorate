[package]
name = "protectorate-grok-driver"
version = "0.1.0"
edition.workspace = true
description = "Grok ACP stdio chat harness inside a caller-supplied sandbox"

[dependencies]
protectorate-chatlog = { path = "../protectorate-chatlog" }
protectorate-sandbox = { path = "../protectorate-sandbox" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"

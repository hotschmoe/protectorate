[package]
name = "protectorate-node-metrics"
version = "0.1.0"
edition.workspace = true
description = "Host CPU, memory and filesystem metrics for Protectorate nodes"

[dependencies]
protectorate-wire = { path = "../protectorate-wire" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

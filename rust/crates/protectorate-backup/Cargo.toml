[package]
name = "protectorate-backup"
version = "0.1.0"
edition.workspace = true
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
sha2 = "0.10"
cap-std = "3"
tempfile = "3"

[lib]
test = false
doctest = false

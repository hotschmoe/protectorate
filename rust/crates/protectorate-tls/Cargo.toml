[package]
name = "protectorate-tls"
version = "0.1.0"
edition.workspace = true
description = "Hub CA, node certificates and the private-address listener rule"

[dependencies]
protectorate-fsutil = { path = "../protectorate-fsutil" }
libc = "0.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = { version = "0.3", default-features = false, features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }

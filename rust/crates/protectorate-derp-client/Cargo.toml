[package]
name = "protectorate-derp-client"
version = "0.1.0"
edition.workspace = true

[dependencies]
crypto_box = { version = "0.9", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
webpki-roots = "1"

[dev-dependencies]
protectorate-derp = { path = "../protectorate-derp" }
tempfile = "3"

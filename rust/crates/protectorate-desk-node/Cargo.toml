[package]
name = "protectorate-desk-node"
version = "0.1.0"
edition.workspace = true
description = "Node-side desktop policy and Windows driver"

[dependencies]
protectorate-desk-policy = { path = "../protectorate-desk-policy" }
protectorate-fsutil = { path = "../protectorate-fsutil" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

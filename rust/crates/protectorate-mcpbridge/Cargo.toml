[package]
name = "protectorate-mcpbridge"
version = "0.1.0"
edition.workspace = true
description = "MCP bridge that serves the unary hub RPCs as tools over stdio or streamable HTTP"

[dependencies]
protectorate-connect-client = { path = "../protectorate-connect-client" }
protectorate-wire = { path = "../protectorate-wire" }
protectorate-tls = { path = "../protectorate-tls" }
prost-reflect = { version = "0.16", features = ["serde"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
futures-core = "0.3"
getrandom = "0.2"
subtle = "2"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[bin]]
name = "protectorate-mcpbridge"
path = "src/main.rs"

[dev-dependencies]
protectorate-fsutil = { path = "../protectorate-fsutil" }
tempfile = "3"

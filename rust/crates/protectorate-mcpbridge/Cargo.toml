[package]
name = "protectorate-mcpbridge"
version = "0.1.0"
edition.workspace = true
autotests = false
description = "MCP bridge that serves the unary hub RPCs as tools over stdio or streamable HTTP"

[dependencies]
protectorate-connect-client = { path = "../protectorate-connect-client" }
protectorate-wire = { path = "../protectorate-wire" }
protectorate-tls = { path = "../protectorate-tls" }
protectorate-fsutil = { path = "../protectorate-fsutil" }
prost-reflect = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
futures-core = { workspace = true }
subtle = { workspace = true }
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[[bin]]
name = "protectorate-mcpbridge"
path = "src/main.rs"
test = false

[dev-dependencies]
tempfile = { workspace = true }

[lib]
test = false

[[test]]
name = "e2e"
path = "tests/e2e.rs"

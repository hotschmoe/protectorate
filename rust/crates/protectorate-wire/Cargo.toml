[package]
name = "protectorate-wire"
version = "0.1.0"
edition.workspace = true
[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
prost-reflect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
futures-core = { workspace = true }

# The hub needs axum's ws and json features. Every crate that has axum also has
# wire, so adding them here gives each -p build on a hub host the same axum as
# the workspace build, while the Windows and Android nodes keep the lean one.
[target.'cfg(not(any(windows, target_os = "android")))'.dependencies]
axum = { workspace = true, features = ["ws", "json"] }

[lib]
test = false
doctest = false

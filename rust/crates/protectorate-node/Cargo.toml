[package]
name = "protectorate-node"
version = "0.1.0"
edition.workspace = true
description = "Rust node agent RPC entry point"

[dependencies]
protectorate-wire = { path = "../protectorate-wire" }
protectorate-node-metrics = { path = "../protectorate-node-metrics" }
protectorate-fsutil = { path = "../protectorate-fsutil" }
protectorate-xfer = { path = "../protectorate-xfer" }
protectorate-sandbox = { path = "../protectorate-sandbox" }
axum = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
zip = { workspace = true }
glob = { workspace = true }

# chrono's clock feature pulls iana-time-zone and android_system_properties on
# Android; the workspace build enables it through the hub, so every other
# target enables it here to keep -p builds identical.
[target.'cfg(not(target_os = "android"))'.dependencies]
chrono = { workspace = true, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
getrandom = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }

[lib]
test = false
doctest = false

[[bin]]
name = "protectorate-node-sandbox-helper"
path = "src/bin/protectorate-node-sandbox-helper.rs"
test = false

[package]
name = "protectorate-connect-client"
version = "0.1.0"
edition.workspace = true
description = "Bounded Connect JSON client for Protectorate RPCs"

[dependencies]
protectorate-wire = { path = "../protectorate-wire" }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zeroize = "1"

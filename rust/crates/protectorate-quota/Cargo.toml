[package]
name = "protectorate-quota"
version = "0.1.0"
edition.workspace = true
description = "Provider quota snapshots, caching and harness ranking, a Rust port of internal/quota"

[features]
default = ["net"]
net = ["dep:ureq"]

[dependencies]
chrono = { workspace = true, features = ["clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
protectorate-sandbox = { path = "../protectorate-sandbox" }
windows-sys = { workspace = true }

[lib]
test = false
doctest = false

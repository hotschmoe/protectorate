name: protectorate
description: "Protectorate client: chat with Envoy and the sleeves, nodes, quota and approvals."
publish_to: 'none'
version: 0.0.0+0

environment:
  sdk: ^3.12.1

# Third-party packages: none. Each one added needs a row in ../DEPENDENCIES.md and an exact pin.
dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: false
  assets:
    - assets/logo.png
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

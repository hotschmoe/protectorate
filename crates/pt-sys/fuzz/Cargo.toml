[package]
name = "pt-sys-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libc = "=0.2.191"
libfuzzer-sys = "=0.4.13"
pt-sys = { path = ".." }

[[bin]]
name = "pdeath"
path = "fuzz_targets/pdeath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signals"
path = "fuzz_targets/signals.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signal_errno"
path = "fuzz_targets/signal_errno.rs"
test = false
doc = false
bench = false

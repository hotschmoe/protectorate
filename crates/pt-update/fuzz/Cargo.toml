[package]
name = "pt-update-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
pt-update = { path = ".." }
semver = "=1.0.28"

[[bin]]
name = "tags"
path = "fuzz_targets/tags.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sums"
path = "fuzz_targets/sums.rs"
test = false
doc = false
bench = false

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop-windows:
    uses: ./.github/workflows/desktop-windows.yml

  rust-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Zig linker for the glibc floor
        run: |
          case "$(uname -m)" in
            x86_64) sum=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
            aarch64) sum=ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17 ;;
          esac
          zig="zig-$(uname -m)-linux-0.16.0"
          curl -fsSLo "$RUNNER_TEMP/$zig.tar.xz" "https://ziglang.org/download/0.16.0/$zig.tar.xz"
          echo "$sum  $RUNNER_TEMP/$zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.0 --locked
      - name: Build Rust hub bundle
        run: bash scripts/build-rust-dist.sh "$GITHUB_REF_NAME" arm64
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-arm64
          path: dist/*
          if-no-files-found: error

  release:
    needs: [desktop-windows, rust-arm64]
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Version
        run: |
          version=$(git describe --tags --match 'v[0-9]*' --always)
          test "$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME builds as $version"; exit 1; }
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "Rust release $version" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare Flutter client
        run: cd app && flutter pub get
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Rust workspace gate
        env:
          PROTECTORATE_REQUIRE_FLUTTER_TEST: "1"
        run: make check
      - name: Rust Linux installer checks
        run: bash scripts/test-rust-installers.sh
      - name: Zig linker for the glibc floor
        run: |
          case "$(uname -m)" in
            x86_64) sum=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
            aarch64) sum=ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17 ;;
          esac
          zig="zig-$(uname -m)-linux-0.16.0"
          curl -fsSLo "$RUNNER_TEMP/$zig.tar.xz" "https://ziglang.org/download/0.16.0/$zig.tar.xz"
          echo "$sum  $RUNNER_TEMP/$zig.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/$zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.0 --locked
      - name: Build Rust Linux amd64 bundle
        run: bash scripts/build-rust-dist.sh "$BUILD_VERSION" amd64
      - name: Exercise installed Rust bundle
        env:
          PROTECTORATE_TEST_RUST_BIN_DIR: target/x86_64-unknown-linux-gnu/dist
        run: bash scripts/test-rust-installed-bundle.sh
      - uses: actions/download-artifact@v4
        with:
          name: rust-linux-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist
      - run: make app-check
      - run: make app-build-web
      - name: Assemble release assets
        run: bash scripts/package-rust-release.sh "$BUILD_VERSION"
      - name: Verify packaged hub with installer
        run: bash install-hub.sh --bundle-dir "$PWD/dist" --dry-run
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

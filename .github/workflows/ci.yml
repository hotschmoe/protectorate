name: ci

on:
  push:
    branches: [master, dev-hotschmoe]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Prepare Flutter client for Rust hub integration tests
        run: cd app && flutter pub get
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Rust workspace
        env:
          PROTECTORATE_REQUIRE_FLUTTER_TEST: "1"
        run: make check
      - name: Rust Linux installer checks
        run: bash scripts/test-rust-installers.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v1
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked
      - name: RustSec advisories
        run: cargo audit

  rust-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build Rust Linux arm64 bundle
        run: |
          version=$(git describe --tags --match 'v[0-9]*' --always)
          PROTECTORATE_BUILD_VERSION="$version" cargo build --locked --profile dist -p protectorate-server -p protectorate-sleeve-runner -p protectorate-cli -p protectorate-mcpbridge --bins
          mkdir -p dist
          for name in protectorate-rs protectorate-sleeve-runner protectorate-sleeve-sandbox-helper protectorate protectorate-mcpbridge; do
            cp "target/dist/$name" "dist/$name-linux-arm64"
          done
          test "$(dist/protectorate-rs-linux-arm64 version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-arm64
          path: dist/*
          if-no-files-found: error

  package:
    needs: [rust, rust-arm64, desktop-windows]
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Version
        run: |
          version=$(git describe --tags --match 'v[0-9]*' --always)
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "Rust package $version" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build Rust Linux amd64 bundle
        run: PROTECTORATE_BUILD_VERSION="$BUILD_VERSION" cargo build --locked --profile dist -p protectorate-server -p protectorate-sleeve-runner -p protectorate-cli -p protectorate-mcpbridge --bins
      - name: Verify embedded server version
        run: test "$(target/dist/protectorate-rs version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "$BUILD_VERSION"
      - name: Exercise installed Rust bundle
        env:
          PROTECTORATE_TEST_RUST_BIN_DIR: target/dist
        run: bash scripts/test-rust-installed-bundle.sh
      - uses: actions/download-artifact@v4
        with:
          name: rust-linux-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist
      - name: Prepare Flutter client
        run: cd app && flutter pub get
      - run: make app-build-web
      - name: Assemble checked Rust release assets
        run: bash scripts/package-rust-release.sh "$BUILD_VERSION"
      - name: Verify packaged hub with installer
        run: bash install-hub.sh --bundle-dir "$PWD/dist" --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: protectorate-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

  desktop-windows:
    uses: ./.github/workflows/desktop-windows.yml

  dev-release:
    needs: [package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-hotschmoe'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: protectorate-dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: protectorate-${{ github.sha }}
          path: dist
      - name: Publish rolling development release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          published=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" --jq .object.sha 2>/dev/null || true)
          if [ -n "$published" ] && [ "$published" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$published"; then
            echo "A newer green push superseded this build; leaving dev unchanged."
            exit 0
          fi
          version=$(git describe --tags --match 'v[0-9]*' --always)
          test "$(cat dist/VERSION)" = "$version"
          (cd dist && sha256sum --check SHA256SUMS)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/dev -f sha="$GITHUB_SHA"
          fi
          notes="Rolling development build $version from $GITHUB_SHA."
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --title "$version" --notes "$notes" --prerelease --latest=false
            gh release upload dev dist/* --clobber
          else
            gh release create dev dist/* --title "$version" --notes "$notes" --prerelease --latest=false --verify-tag
          fi

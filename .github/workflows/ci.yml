name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: bufbuild/buf-setup-action@v1
      - name: Generator plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest
          dart pub global activate protoc_plugin
          dart pub global activate connectrpc
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Version
        run: |
          echo "version $(make -s version), app $(make -s version-app)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet and race tests
        run: make test
      - run: make check-gen
      - run: make check-version
      - name: Go binaries for every target
        run: make cross
      - run: make app-check
      - run: make app-build-web
      - run: make apk
      - uses: actions/upload-artifact@v4
        with:
          name: protectorate-${{ github.sha }}
          path: |
            bin/protectorate-*
            app/build/web
            app/build/app/outputs/flutter-apk/app-release.apk

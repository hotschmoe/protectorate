[workspace]
resolver = "2"
members = ["rust/crates/*"]

[workspace.package]
edition = "2021"

# Every third-party dependency is declared here with the union of the features
# the workspace uses, and members take it with `workspace = true` and no
# feature additions of their own. A `-p <crate>` build then asks for the same
# features as the `--workspace` build, so cargo reuses the compiled crates
# instead of building a second copy under a new hash.
[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
cap-std = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.2"
http = "1"
libc = "0.2"
percent-encoding = "2"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
qrcodegen = "1.8"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "fs", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
webpki-roots = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Threading"] }
zeroize = "1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The published release assets: one fully LTO'd codegen unit and no symbol
# table make them about 40% smaller than `release`, for about 1.5x its build
# time, so `make build` stays on `release`. Never panic = "abort": the hub
# relies on unwinding to turn a panicking task into an error.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
